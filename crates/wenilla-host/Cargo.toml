[package]
name = "wenilla-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native web host for the browser build: serves the wasm bundle, answers /data/* from the real MPQ chain, and proxies /ws/{port} to the world/login TCP sockets"

# Never built for wasm32 — it's a native bin nobody depends on (Lane H note). `benilla-formats`
# is taken with `default-features = false` for the same reason `benilla` takes it that way: the
# `dev` feature bakes this source tree's absolute path into `install::candidates`' probe, and a
# server binary that runs on the box (not a player's machine) has no business carrying it either.
[dependencies]
anyhow.workspace = true
clap.workspace = true
benilla-formats = { path = "../benilla-formats", default-features = false }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
# Splits `axum::extract::ws::WebSocket` into independent read/write halves — it implements
# Stream + Sink but has no `.split()` of its own, and the proxy needs both directions live at
# once. `sink`/`std` only: no futures executor of our own, tokio already is one.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tower-http = { version = "0.7", features = ["fs", "compression-br", "compression-gzip", "set-header", "trace"] }
# Only for `ServiceBuilder`, to layer compression + a Cache-Control override onto `ServeDir` —
# tower-http's own layers need something to stack them with.
tower = "0.5"
percent-encoding = "2.3"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
# HTTPS for a phone on the same Wi-Fi. Safari only exposes WebGPU in a secure context, and a
# handset cannot open this machine's localhost, so `make start` serves a generated certificate
# beside the loopback HTTP port. axum 0.8's own example uses this crate for that.
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
# Only the WebSocket proxy test needs a client library (framing is fiddly to hand-roll); the
# plain-HTTP tests talk raw sockets — one GET request doesn't need a whole HTTP client crate.
tokio-tungstenite = "0.30"
# `ServiceExt::oneshot`, so `data`'s compression predicate can be exercised as a router without
# a socket or a 5 GB game install behind it — the feature the non-dev `tower` dep doesn't need.
tower = { version = "0.5", features = ["util"] }
# Reads the generated certificate back in tests to assert the IP SAN iOS requires.
x509-parser = "0.16"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
