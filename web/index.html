<script>
  // Sound: the browser suspends any AudioContext created before the first user gesture (autoplay
  // policy), and the mixer (kira/cpal) creates its at startup and never resumes it — so the tab
  // stayed silent. Remember every context the page creates and resume them on the first
  // click/key, which is the only place a browser lets that happen.
  (() => {
    const contexts = [];
    for (const name of ['AudioContext', 'webkitAudioContext']) {
      const Orig = window[name];
      if (!Orig) continue;
      const Patched = function (...args) {
        const ctx = new Orig(...args);
        contexts.push(ctx);
        return ctx;
      };
      Patched.prototype = Orig.prototype;
      window[name] = Patched;
    }
    const resume = () => {
      console.log(`audio: gesture — ${contexts.length} context(s): ${contexts.map((c) => c.state).join(',') || 'none'}`);
      for (const ctx of contexts) {
        if (ctx.state !== 'running') {
          ctx.resume().then(() => console.log(`audio: context resumed (${ctx.state})`), () => {});
        }
      }
    };
    for (const ev of ['pointerdown', 'keydown', 'touchstart']) {
      window.addEventListener(ev, resume, { capture: true, passive: true });
    }
  })();
</script>
<script>
  // iPhone Safari has no element fullscreen API. winit falls back to the prefixed
  // method when the standard method is absent; keep that fallback from throwing.
  if (!Element.prototype.requestFullscreen && !Element.prototype.webkitRequestFullscreen) {
    Element.prototype.webkitRequestFullscreen = function () {};
    if (!Document.prototype.webkitExitFullscreen) {
      Document.prototype.webkitExitFullscreen = function () {};
    }
  }
</script>

<script>
  // WGSL compile errors are otherwise invisible: wgpu's browser backend never asks the module for
  // its compilation info, so Chrome only prints the "[Invalid ShaderModule] … previous error"
  // cascade. Ask on its behalf and print the real diagnostics — cheap, and only speaks on errors.
  if (navigator.gpu && window.GPUDevice) {
    const orig = GPUDevice.prototype.createShaderModule;
    GPUDevice.prototype.createShaderModule = function (desc) {
      const m = orig.call(this, desc);
      // Diagnostics are optional, including on browsers that expose only part of WebGPU.
      if (typeof m.getCompilationInfo !== 'function') return m;
      Promise.resolve().then(() => m.getCompilationInfo()).then((info) => {
        const errs = info.messages.filter((x) => x.type === 'error');
        if (!errs.length) return;
        const lines = (desc.code || '').split('\n');
        for (const e of errs) {
          console.error(`WGSL error in ${desc.label || '(unlabeled)'} @${e.lineNum}:${e.linePos}: ${e.message}\n    ${lines[e.lineNum - 1] || ''}`);
        }
      }).catch((error) => console.warn('Shader diagnostic unavailable:', error?.message ?? error));
      return m;
    };
  }
</script>

<script>
  // Dev page: allow `?user=&pass=&char=` links to log in. A hosting page that fetched the
  // credentials itself sets `window.__wenilla_env = {user, pass, host}` here instead, and the

<script type="module">
  import { mountMobile } from './mobile.js';
  import init from './wenilla.js';
  // A private host can limit its picker to the terrain it supplies. Local hosts
  // without this optional route keep the full game's selection.
  try {
    const config = await fetch('./play-config.json', { cache: 'no-store' });
    if (config.ok) window.__survivorsHosting = await config.json();
  } catch (error) { console.warn('Optional play configuration:', error); }
  mountMobile();
  import { bind } from './wasi_stubs.js';
  import { boot } from './boot.js';
  // `boot(init)` is the loading overlay + parallel data prefetch (see boot.js's header); it calls
  // `init()` with a byte-counted Response, and `init()` instantiates the wasm module, which runs
  // `#[wasm_bindgen(start)] start()` as part of instantiation (`wenilla/src/lib.rs`) — that's the
  // whole boot, canvas included (`boot.rs` binds to `#benilla` by id, so no query/lookup belongs
  // here). `bind(w.memory)` comes AFTER on purpose: the wasm Lua VM's WASI shims
  // (`wasi_stubs.js`'s own header) can only zero a WASI caller's out-pointers once the module's
  // linear memory exists to write into, and `init()` is what creates it.
  // Durable settings storage (the saved pick lives in localStorage): dynamic, unawaited, never
  // load-bearing — see web/platform.js.
  import('./platform.js')
    .then(({ requestPersistentStorage }) => requestPersistentStorage())
    .catch((e) => console.warn('platform.js:', e));
  // The JavaScript bridge (web/bridge.js, `window.wenilla` in the console): live game state
  // out, commands in, the hidden-tab keepalive. Dynamic, never load-bearing. `?bridge=hud` /
  // `?bridge=idle` mount an example from web/examples/ on top; `?bridge=0` turns it off.
  import('./bridge.js')
    .then(({ default: bridge }) => {
      if (window.__survivorsMobileInput?.active) {
        bridge.background.hz = 0;
        bridge.background.stop();
      }
      const example = new URLSearchParams(location.search).get('bridge');
      if (example && /^[a-z]+$/.test(example) && example !== '0') {
        import(`./examples/${example}.js`).catch((e) => console.warn(`examples/${example}.js:`, e));
      }
    })
    .catch((e) => console.warn('bridge.js:', e));
  // Safari on iOS 26+ exposes WebGPU only in a secure context.
  if (!navigator.gpu) {
    const message = document.createElement('div');
    message.style.cssText = 'position:fixed;inset:0;z-index:100;background:#12120f;color:#f7f3e9;padding:max(28px,env(safe-area-inset-top)) 24px;font:17px/1.6 system-ui;display:grid;place-content:center';
    message.textContent = 'Azeroth Survivors needs WebGPU. On iPhone, use Safari on iOS 26 or later and open this game over HTTPS. Localhost also works on the same device.';
    message.setAttribute('role', 'alert');
    document.body.append(message);
    throw new Error('WebGPU unavailable');
  }
  const w = await boot(init);
  bind(w.memory);
</script>
